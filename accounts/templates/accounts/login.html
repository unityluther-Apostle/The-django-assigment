<!DOCTYPE html>
<html lang="en"> 
<head> 
	<meta charset="UTF-8">
	<title> Login School Notifications </title>
	
	<style>
		body {
			font-family: sans-serif; 
			max-width: 400px; 
			margin: 60px auto; 
			padding: 20px;
			background-color: #ffffff;
			color: #1b4332;
		}
		h1 {
			font-size: 1.4rem; 
			color: #1b4332;
			margin-bottom: 24px;
		}
		p {
			margin-top: 12px;
			margin-bottom: 12px;
		}
		label {
			display: block; 
			margin-top: 12px; 
			font-weight: bold;
			color: #1b4332;
		}
		input[type="text"], input[type="password"] {
			width: 100%; 
			padding: 8px; 
			box-sizing: border-box;
			border: 1px solid #1b4332;
			background-color: #ffffff;
			color: #1b4332;
			margin-top: 4px;
		}
		button {
			background-color: #1b4332;
			color: #ffffff;
			border: none;
			padding: 10px 20px;
			font-size: 1rem;
			cursor: pointer;
			margin-top: 16px;
			width: 100%;
		}
		.error {
			color: #b91c1c; 
			margin-top: 8px;
			font-weight: bold;
		}
	</style>
</head>

<body>
	<h1> Sign in </h1>
	
	{% if form.errors %}
		<p class="error">Your username or password did not match. Please try again. </p>
	{% endif %}
	
	<form method="post">
		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit">Log in </button>
	</form>	
</body>
</html>
